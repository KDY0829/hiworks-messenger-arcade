name: Windows release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Windows cross compiler
        run: >
          npm install --prefix "$RUNNER_TEMP/officechat-zig"
          --no-audit --no-fund
          @oven/zig-linux-x64@0.12.0-dev.1286

      - name: Build EXE and ZIP
        env:
          ZIG: ${{ runner.temp }}/officechat-zig/node_modules/@oven/zig-linux-x64/zig
        run: |
          bash desktop/build-linux.sh
          cd desktop
          sha256sum OfficeChat.exe build/OfficeChat-Windows.zip > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$REF_TYPE" == "tag" ]]; then
            tag="$REF_NAME"
            title="OfficeChat $tag"
          else
            tag="latest"
            title="OfficeChat 최신 개발 버전"
            gh api --method PATCH \
              "repos/$GH_REPO/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" -F force=true \
              || gh api --method POST \
                "repos/$GH_REPO/git/refs" \
                -f ref="refs/tags/latest" -f sha="$GITHUB_SHA"
          fi

          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## Windows PC 실행기

          - Windows 10/11 x64 지원
          - Microsoft Edge와 인터넷 연결 필요
          - 온라인 서비스에 연결하는 실행기이며 오프라인 서버는 포함하지 않습니다.
          - Windows용 크로스 빌드이며, 실제 Windows 실행 검증은 별도로 필요합니다.

          ## 다운로드

          - OfficeChat.exe: 다운로드 후 실행
          - OfficeChat-Windows.zip: 실행 파일, 사용 안내, 라이선스, 소스, 실행 파일 SHA256 포함
          - SHA256SUMS.txt: EXE와 ZIP의 SHA256 체크섬

          빌드 커밋: $GITHUB_SHA
          EOF

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "$title" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          elif [[ "$tag" == "latest" ]]; then
            gh release create "$tag" --verify-tag \
              --title "$title" --prerelease \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$tag" --verify-tag \
              --title "$title" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

          gh release upload "$tag" \
            desktop/OfficeChat.exe \
            desktop/build/OfficeChat-Windows.zip \
            desktop/SHA256SUMS.txt \
            --clobber
